name: Build and release mods

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mod-releases-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build 7 independent mods and publish versioned releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install .NET SDK 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Download private IL2CPP build references
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MOD_BUILD_REFS_TOKEN }}
          MOD_BUILD_REFS_REPO: ${{ vars.MOD_BUILD_REFS_REPO }}
        run: |
          set -euo pipefail
          if [[ -z "$GH_TOKEN" || -z "$MOD_BUILD_REFS_REPO" ]]; then
            echo "::error::Configure Actions variable MOD_BUILD_REFS_REPO and secret MOD_BUILD_REFS_TOKEN. See CI.md."
            exit 1
          fi
          gh release download build-refs --repo "$MOD_BUILD_REFS_REPO" \
            --pattern "BepInEx-build-refs.zip" --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/BepInEx-build-refs.zip" -d "$RUNNER_TEMP"
          refs="$RUNNER_TEMP/BepInEx"
          test -f "$refs/core/BepInEx.Core.dll" || { echo "::error::Missing core/BepInEx.Core.dll"; exit 1; }
          test -f "$refs/interop/Assembly-CSharp.dll" || { echo "::error::Missing interop/Assembly-CSharp.dll"; exit 1; }
          echo "BEPINEX_DIR=$refs" >> "$GITHUB_ENV"

      - name: Build and pack all mods
        shell: bash
        run: bash scripts/build-releases.sh

      - name: Upload independent mod ZIPs as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vivat-mods-build-${{ github.run_number }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish one GitHub Release per mod version
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS='|' read -r module version tag archive; do
            [[ -n "$module" ]] || continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists; leaving the published version unchanged."
              continue
            fi
            gh release create "$tag" "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$module v$version" \
              --notes "Samostatný mod $module v$version. Rozbal ZIP do kořenové složky Vivat Slovakia. Podrobnosti v INSTALL.md." \
              --latest=false
            echo "Published $tag"
          done < dist/manifest.txt
